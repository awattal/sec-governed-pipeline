basis: Critical data element, mandatory. Structurally guaranteed - computed as `segments
  is null`, which returns a boolean, and additionally filtered on by the model. Registered
  so the control is visible to consumers who cannot see the transformation.
implication: A null here would mean a fact could not be classified as consolidated
  or segmented. Consolidated and segment-level figures would mix, and totals would
  double-count (F14).

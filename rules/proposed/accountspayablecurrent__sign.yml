rule_id: accountspayablecurrent__sign
status: proposed
concept: AccountsPayableCurrent
check_type: sign
target: int_num_in_scope.value
assertion:
  direction: non_negative
rationale: AccountsPayableCurrent has a credit balance type representing amounts owed
  to vendors for goods and services received. As a liability, its carrying value cannot
  be negative; a negative balance would imply the entity is owed money by vendors
  rather than owing them, which contradicts the definition of accounts payable.
implication: A negative value would indicate a sign-flip error, misclassification
  (e.g., a debit balance or reversal entry mistakenly tagged), or an XBRL tagging
  mistake, any of which would distort liability totals and mislead downstream liquidity
  or working-capital analysis.
confidence: high
observation: null
definition: Carrying value as of the balance sheet date of liabilities incurred (and
  for which invoices have typically been received) and payable to vendors for goods
  and services received that are used in an entity's business. Used to reflect the
  current portion of the liabilities (due within one year or within the normal operating
  cycle if longer).

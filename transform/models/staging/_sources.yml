version: 2

sources:
  - name: sec_raw
    description: >
      SEC Financial Statement Data Sets, loaded quarterly from the source
      ZIP by scripts/ingest.py. Structure is defined by the SEC; this
      project reads these tables and does not write to them. Every row
      carries a quarter column recording the batch it arrived in.
    schema: main
    tables:
      - name: sub
        description: >
          One row per submission. Filer identity, form type, period and
          filing dates. 6,304 rows in 2025Q4. Date columns arrive as
          integers, not dates — see F1.
        columns:
          - name: adsh
            description: Accession number. Unique identifier for a submission.
          - name: period
            description: Balance sheet date, yyyymmdd as an integer.
          - name: form
            description: Submission type, e.g. 10-K, 10-Q, 20-F.

      - name: num
        description: >
          One row per reported numeric fact. 3,832,977 rows in 2025Q4.
          Grain is dimensional — rows where segments is null are
          consolidated totals, the rest are breakdowns. See F14.
        columns:
          - name: adsh
            description: Accession number. Foreign key to sub.
          - name: tag
            description: Concept name. Foreign key to tag with version.
          - name: version
            description: Taxonomy the tag belongs to, or the filer's adsh if custom.
          - name: ddate
            description: Period end date for this fact, yyyymmdd as an integer.
          - name: qtrs
            description: Quarters the value spans. 0 is an instant. See F8.
          - name: segments
            description: Dimensional breakdown. Null means a consolidated total.

      - name: tag
        description: >
          Concept dictionary. 84,907 rows in 2025Q4, of which 91% are
          filer-defined extensions rather than standard taxonomy entries.
          See F4.
        columns:
          - name: tag
            description: Concept name.
          - name: version
            description: Taxonomy identifier.
          - name: custom
            description: 1 if filer-defined, 0 if from a standard taxonomy.
          - name: iord
            description: I for instant, D for duration. See F7 and F10.

      - name: pre
        description: >
          Presentation detail — where each fact appears on a primary
          financial statement, and in what order. 719,346 rows in 2025Q4.
          Not currently consumed by the modelled layer.
        columns:
          - name: adsh
            description: Accession number. Foreign key to sub.
          - name: tag
            description: Concept name.
          - name: stmt
            description: Statement the line appears on, e.g. BS, IS, CF.